name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Qt (prebuilt, no source build)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Install Python (embeddable, prebuilt)
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath deps/python

      - name: Install SQLite (prebuilt)
        run: |
          Invoke-WebRequest -Uri "https://sqlite.org/2026/sqlite-dll-win-x64-3530400.zip" -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath deps/sqlite

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install remaining dependencies (vcpkg, cached)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          vcpkg install libzip yaml-cpp curl --triplet x64-windows-release
          echo "VCPKG_ROOT=$(Split-Path (Get-Command vcpkg).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --target gamemodmanager

      - name: Collect artifacts
        run: |
          mkdir artifact
          Copy-Item build/gamemodmanager.exe artifact/
          Get-ChildItem build/plugins/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/
          Get-ChildItem build/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/
          Copy-Item deps/sqlite/sqlite3.dll artifact/
          Copy-Item deps/python/*.* artifact/ -Recurse
          windeployqt artifact/gamemodmanager.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifact/
