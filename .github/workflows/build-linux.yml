name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout submodules at latest main
        run: git submodule update --init --recursive --remote

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev cmake g++ \
            libzip-dev libsqlite3-dev libyaml-cpp-dev \
            libcurl4-openssl-dev nlohmann-json3-dev \
            libfuse3-dev libpython3-dev \
            libxkbcommon-dev libarchive-dev \
            icoutils

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc) --target gamemodmanager

      - name: Collect artifacts
        run: |
          mkdir -p artifact/lib

          # Bundle the binary
          cp build/gamemodmanager artifact/

          # Bundle plugins
          cp build/plugins/*.so artifact/lib/ 2>/dev/null || true

          # Bundle all transitive shared library dependencies (exclude system libs)
          BUNDLE_DEPS() {
              local exe="$1"
              ldd "$exe" | awk '/=> \// {print $3}' | while read -r lib; do
                  # Skip libc, libstdc++, libm, libgcc, ld-linux, libdl, libpthread, librt
                  base=$(basename "$lib")
                  case "$base" in
                      libc.so*|libstdc++.so*|libm.so*|libgcc_s.so*|ld-linux*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libutil.so*|libnss_*|libGLdispatch*)
                          ;;
                      *)
                          if [ ! -f "artifact/lib/$base" ]; then
                              cp -L "$lib" artifact/lib/
                          fi
                          ;;
                  esac
              done
          }

          BUNDLE_DEPS build/gamemodmanager
          for plugin in build/plugins/*.so; do
              [ -f "$plugin" ] && BUNDLE_DEPS "$plugin"
          done

          # Create wrapper script that sets LD_LIBRARY_PATH
          printf '%s\n' \
            '#!/bin/bash' \
            'DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$DIR/gamemodmanager" "$@"' \
            > artifact/gamemodmanager.sh
          chmod +x artifact/gamemodmanager.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: artifact/
